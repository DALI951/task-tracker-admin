name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk \
            releases/Task-Tracker-Admin.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-apk
          path: releases/Task-Tracker-Admin.apk

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /task-tracker-admin/

      - name: Zip web build
        run: |
          cd build/web
          zip -r "$GITHUB_WORKSPACE/releases/Task-Tracker-Admin-web.zip" .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-zip
          path: releases/Task-Tracker-Admin-web.zip

      - name: Upload web pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-release:
    needs: [build-apk, build-web]
    if: always() && (needs.build-apk.result == 'success' || needs.build-web.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all available artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          mkdir -p release_files
          find artifacts/ -type f \( -name '*.apk' -o -name '*.zip' \) -exec cp {} release_files/ \; 2>/dev/null || true
          ls -la release_files/ || echo "No release files found"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Task Tracker Admin v1.0.0"
          body: |
            ## Task Tracker Admin Panel

            ### Android
            1. Download `Task-Tracker-Admin.apk`
            2. Open on your Android device
            3. Allow installation from unknown sources if prompted

            ### Web
            1. Download `Task-Tracker-Admin-web.zip`
            2. Extract and open `index.html`
            3. Or visit: https://dali951.github.io/task-tracker-admin/
          files: release_files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

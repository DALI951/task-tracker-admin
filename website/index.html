<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker - Create Account</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { background: white; border-radius: 16px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 28px; }
        .header .icon { width: 64px; height: 64px; background: #1565C0; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; }
        .header .icon svg { width: 32px; height: 32px; fill: white; }
        .header h1 { font-size: 22px; color: #1a1a1a; font-weight: 700; }
        .header p { font-size: 14px; color: #666; margin-top: 6px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 10px; font-size: 15px; transition: all 0.15s; }
        .form-group input:focus { outline: none; border-color: #1565C0; box-shadow: 0 0 0 3px rgba(21,101,192,0.1); }
        .form-group input::placeholder { color: #aaa; }
        .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
        .btn-primary { background: #1565C0; color: white; }
        .btn-primary:hover { background: #0D47A1; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .message { padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-top: 14px; line-height: 1.5; }
        .message.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .message.error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .hidden { display: none; }
        .success-box { text-align: center; padding: 20px 0; }
        .success-box .check { width: 64px; height: 64px; background: #e8f5e9; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; }
        .success-box .check svg { width: 32px; height: 32px; fill: #2e7d32; }
        .success-box h2 { font-size: 20px; color: #1a1a1a; margin-bottom: 8px; }
        .success-box p { font-size: 14px; color: #666; margin-bottom: 20px; }
        .download-btn { display: inline-block; padding: 12px 28px; background: #1565C0; color: white; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 15px; transition: all 0.15s; }
        .download-btn:hover { background: #0D47A1; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #999; }
        .password-hint { font-size: 11px; color: #999; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <!-- Registration Form -->
        <div id="formScreen">
            <div class="header">
                <div class="icon">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                </div>
                <h1>Task Tracker</h1>
                <p>Create your account to get started</p>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Min 6 characters" autocomplete="new-password">
                <div class="password-hint">At least 6 characters</div>
            </div>
            <div class="form-group">
                <label>Display Name</label>
                <input type="text" id="displayName" placeholder="Your name" autocomplete="name">
            </div>
            <button class="btn btn-primary" id="createBtn" onclick="createAccount()">Create Account</button>
            <div id="message"></div>
        </div>

        <!-- Success Screen -->
        <div id="successScreen" class="hidden">
            <div class="success-box">
                <div class="check">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                </div>
                <h2>Account Created!</h2>
                <p>Your account is ready. Download the app and sign in with your email and password.</p>
                <a href="https://github.com/DALI951/task-tracker/releases/latest" class="download-btn" target="_blank">Download App</a>
            </div>
        </div>

        <div class="footer">Task Tracker &copy; 2026</div>
    </div>

    <script type="module">
        const firebaseConfig = {
            apiKey: "AIzaSyCm-npO3B4toDBgYQltMRbPOMJxeeypVbw",
            authDomain: "task-tracker-6d7e1.firebaseapp.com",
            projectId: "task-tracker-6d7e1",
            storageBucket: "task-tracker-6d7e1.firebasestorage.app",
            messagingSenderId: "202182349540",
            appId: "1:202182349540:android:ac882cbe77afa54f5752f1"
        };

        window.createAccount = async function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const displayName = document.getElementById('displayName').value.trim();

            if (!email || !password || !displayName) {
                showMessage('All fields are required', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            if (!email.includes('@')) {
                showMessage('Please enter a valid email', 'error');
                return;
            }

            const btn = document.getElementById('createBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                // Step 1: Create the account via REST API
                const signUpRes = await fetch(
                    `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${firebaseConfig.apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: email,
                            password: password,
                            returnSecureToken: true
                        })
                    }
                );
                const signUpData = await signUpRes.json();

                if (signUpData.error) {
                    let msg = signUpData.error.message;
                    if (msg === 'EMAIL_EXISTS') msg = 'An account with this email already exists';
                    else if (msg === 'WEAK_PASSWORD') msg = 'Password is too weak';
                    else if (msg === 'INVALID_EMAIL') msg = 'Invalid email address';
                    showMessage(msg, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                    return;
                }

                const uid = signUpData.localId;
                const idToken = signUpData.idToken;

                // Step 2: Write the user document to Firestore via REST API
                const firestoreUrl = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/users/${uid}`;
                const firestoreBody = {
                    fields: {
                        email: { stringValue: email },
                        displayName: { stringValue: displayName },
                        role: { stringValue: 'employee' },
                        createdAt: { stringValue: new Date().toISOString() }
                    }
                };

                const fsRes = await fetch(firestoreUrl, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${idToken}`
                    },
                    body: JSON.stringify(firestoreBody)
                });

                if (!fsRes.ok) {
                    // Account created but Firestore write failed - still show success
                    // The user can still sign in
                    console.warn('Firestore write failed:', await fsRes.text());
                }

                // Step 3: Show success
                document.getElementById('formScreen').classList.add('hidden');
                document.getElementById('successScreen').classList.remove('hidden');

            } catch (e) {
                showMessage(e.message || 'Failed to create account. Please try again.', 'error');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        };

        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.className = `message ${type}`;
            el.textContent = text;
            setTimeout(() => { el.textContent = ''; el.className = ''; }, 6000);
        }

        // Allow Enter key to submit
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !document.getElementById('formScreen').classList.contains('hidden')) {
                window.createAccount();
            }
        });
    </script>
</body>
</html>
